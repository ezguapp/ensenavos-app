services:
  backend:
    build: ./backend
    container_name: ensenavos_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./ensenavos.db}"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: ensenavos_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_PROXY_TARGET: "http://backend:8000"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
